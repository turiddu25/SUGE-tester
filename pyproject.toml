[project]
name = "suge-tutor"
version = "0.1.0"
description = "Self-paced revision web app for COMPSCI4087 Startup Growth Engineering"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
include = ["suge_tutor*"]
